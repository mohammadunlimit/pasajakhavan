<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سامانه مدیریت پاساژ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F5;
  --surface:#FFFFFF;
  --surface-2:#ECEFEE;
  --ink:#152321;
  --ink-dim:#5C6D69;
  --line:#DDE3E1;
  --brand:#1F5C4F;
  --brand-ink:#0F332B;
  --gold:#B8862E;
  --danger:#B4432E;
  --ok:#2E8B57;
  --radius:18px;
  --radius-sm:12px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101715;
    --surface:#182220;
    --surface-2:#1F2B28;
    --ink:#EAF1EE;
    --ink-dim:#9FB2AC;
    --line:#2A3733;
    --brand:#3E9C85;
    --brand-ink:#BFE8DA;
    --gold:#D6A94E;
  }
}
:root[data-theme="dark"]{
  --bg:#101715;--surface:#182220;--surface-2:#1F2B28;--ink:#EAF1EE;--ink-dim:#9FB2AC;--line:#2A3733;--brand:#3E9C85;--brand-ink:#BFE8DA;--gold:#D6A94E;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Vazirmatn',sans-serif;
  -webkit-font-smoothing:antialiased;
}
#app{
  max-width:480px;
  margin:0 auto;
  min-height:100%;
  padding:16px 14px 90px;
  padding-top:calc(16px + env(safe-area-inset-top,0px));
}
h1,h2,h3{margin:0 0 4px;font-weight:800;}
p{margin:0;color:var(--ink-dim);line-height:1.9;font-size:14px;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand .mark{
  width:38px;height:38px;border-radius:11px;
  background:linear-gradient(160deg,var(--brand),var(--brand-ink));
  display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;
}
.brand .name{font-size:15px;font-weight:800;}
.brand .sub{font-size:11px;color:var(--ink-dim);}
.role-chip{
  font-size:11px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;color:var(--ink-dim);
}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.sqbtn{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:22px 10px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  cursor:pointer;
  text-align:center;
  transition:transform .12s ease, border-color .12s ease;
}
.sqbtn:active{transform:scale(.97);}
.sqbtn .ic{font-size:28px;}
.sqbtn .lb{font-size:12.5px;font-weight:700;}
.stat-row{display:flex;gap:10px;margin-bottom:14px;}
.stat{
  flex:1;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:12px 12px;
}
.stat .lab{font-size:11px;color:var(--ink-dim);display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.stat .val{font-size:15px;font-weight:800;}
.stat.small .val{font-size:13px;}
.menu-item{
  display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:14px;margin-bottom:9px;cursor:pointer;
}
.menu-item .dot{
  width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;
}
.menu-item .txt{flex:1;font-weight:700;font-size:13.5px;}
.menu-item .chev{color:var(--ink-dim);font-size:13px;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--brand);color:#fff;border:none;border-radius:12px;
  padding:12px 16px;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;width:100%;
}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand);}
.btn.danger{background:var(--danger);}
.btn.sm{padding:8px 12px;font-size:12px;width:auto;}
input[type=text],input[type=password],input[type=tel],textarea{
  width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink);font-family:inherit;font-size:13.5px;margin-bottom:10px;
}
.backrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.backrow .bk{
  width:34px;height:34px;border-radius:10px;background:var(--surface);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}
.backrow h2{font-size:16px;}
.plate-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.plate-cell{
  border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;background:var(--surface);
}
.plate-cell .num{font-weight:800;font-size:13px;}
.plate-cell .ph{font-size:20px;}
.plate-cell .nm{font-size:9.5px;color:var(--ink-dim);margin-top:2px;line-height:1.4;}
.tag{display:inline-block;font-size:10.5px;background:var(--surface-2);border-radius:8px;padding:3px 8px;color:var(--ink-dim);margin-top:5px;}
.notice{background:var(--surface-2);border-radius:12px;padding:12px;font-size:12.5px;color:var(--ink-dim);line-height:1.9;}
.divider{height:1px;background:var(--line);margin:14px 0;}
.candidate-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;}
.candidate-row .av{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;}
.candidate-row .info{flex:1;}
.candidate-row .info .n{font-weight:700;font-size:13px;}
.candidate-row .info .p{font-size:11px;}
.checkbox{
  width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;color:transparent;
}
.checkbox.on{background:var(--brand);border-color:var(--brand);color:#fff;}
.color-row{display:flex;gap:8px;margin-top:6px;}
.color-btn{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;background:var(--surface-2);}
.plate-acc-card{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;}
.plate-acc-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.plate-acc-card .head .num{font-weight:800;font-size:13.5px;}
.plate-acc-card .status{font-size:10.5px;color:var(--ink-dim);margin-top:4px;}
.msg-bubble{max-width:80%;padding:9px 12px;border-radius:14px;font-size:13px;margin-bottom:8px;line-height:1.7;}
.msg-bubble.me{background:var(--brand);color:#fff;margin-right:auto;border-bottom-left-radius:4px;}
.msg-bubble.other{background:var(--surface-2);margin-left:auto;border-bottom-right-radius:4px;}
.toast{
  position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:12.5px;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:50;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
.badge-lock{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:14px;font-size:10px;background:var(--surface);border:1px solid var(--line);padding:5px 10px;border-radius:999px;color:var(--ink-dim);z-index:10;}
table.res{width:100%;border-collapse:collapse;font-size:12.5px;}
table.res th,table.res td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;}
table.res th{color:var(--ink-dim);font-weight:700;font-size:11px;}
.rank1{color:var(--gold);font-weight:800;}
</style>
</head>
<body>
<div class="badge-lock">🧪 نسخه نمایشی — داده‌ها واقعی نیستند</div>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- داده‌های نمونه ---------------- */
const state = {
  role: null,          // 'admin' | 'plate' | 'caretaker' | null
  currentPlateId: null,
  screen: 'login',
  history: [],
  electionPhase: 'registration', // registration | voting | closed
  votedPlates: new Set(),
};

const DEFAULTS = {
  adminPass: '094940',
  caretakerPass: '194941',
};
let passwords = JSON.parse(localStorage.getItem('passageApp_pw') || 'null') || {...DEFAULTS};

const plates = JSON.parse(localStorage.getItem('passageApp_plates') || 'null') || Array.from({length:16}).map((_,i)=>({
  id: 101+i,
  password: '1234',
  owner: { name: 'علی', family: ['رضایی','کریمی','احمدی','موسوی','نجفی'][i%5], phone:'0912'+(1000000+i*7), photo:'👤' },
  tenant: i%3===0 ? { name:'زهرا', family:'صادقی', phone:'0935'+(2000000+i*3), photo:'👤' } : null,
  color: ['white','white','green','blue','black','red'][i%6],
  balanceContribution: 0,
  candidate: i%7===0 ? { bio:'کاندیدای عضویت در هیئت مدیره', votes: 0 } : null,
}));

const accountLog = JSON.parse(localStorage.getItem('passageApp_ledger') || 'null') || {
  balance: 850000000,
  expensesThisMonth: 62000000,
  expenseItems: [
    {title:'تعمیر آسانسور', amount: 32000000},
    {title:'نظافت راه‌پله‌ها', amount: 8000000},
    {title:'قبض برق مشترک', amount: 22000000},
  ]
};

const board = [
  {role:'رئیس هیئت مدیره', name:'حسین', family:'کاظمی', plate:101, photo:'🧑‍💼'},
  {role:'نایب رئیس هیئت مدیره', name:'مریم', family:'شریفی', plate:104, photo:'🧑‍💼'},
  {role:'عضو هیئت مدیره', name:'رضا', family:'باقری', plate:107, photo:'🧑‍💼'},
  {role:'عضو هیئت مدیره', name:'سارا', family:'یوسفی', plate:109, photo:'🧑‍💼'},
  {role:'عضو هیئت مدیره', name:'امیر', family:'حسینی', plate:111, photo:'🧑‍💼'},
  {role:'عضو هیئت مدیره', name:'نگار', family:'رحیمی', plate:113, photo:'🧑‍💼'},
  {role:'عضو هیئت مدیره', name:'کاوه', family:'صالحی', plate:115, photo:'🧑‍💼'},
  {role:'حسابدار', name:'فرشته', family:'محمدی', plate:'-', photo:'🧮'},
  {role:'مدیر اجرایی', name:'بهرام', family:'قاسمی', plate:'-', photo:'📋'},
];

const caretakers = JSON.parse(localStorage.getItem('passageApp_caretakers') || 'null') || [
  {name:'عبدی', family:'رضایی', phone:'09184618358', card:'5859831057588708', photo:'🧑‍🔧'},
  {name:'محمد', family:'رضایی', phone:'09182428984', card:'5859831104603138', photo:'🧑‍🔧'},
];

const rulesText = localStorage.getItem('passageApp_rulesText') ||
`۱. سکوت و آرامش در ساعات پایانی روز رعایت شود.
۲. نگهداری وسایل شخصی در راهروهای عمومی ممنوع است.
۳. پرداخت شارژ ماهانه حداکثر تا دهم هر ماه.
۴. هرگونه تغییر در نمای واحد نیاز به تأیید هیئت مدیره دارد.
۵. مسئولیت رفتار مستأجر بر عهده مالک واحد است.`;

function saveAll(){
  localStorage.setItem('passageApp_plates', JSON.stringify(plates));
  localStorage.setItem('passageApp_ledger', JSON.stringify(accountLog));
  localStorage.setItem('passageApp_pw', JSON.stringify(passwords));
  localStorage.setItem('passageApp_caretakers', JSON.stringify(caretakers));
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(window.__tt);
  window.__tt=setTimeout(()=>t.classList.remove('show'),1800);
}
function fmt(n){ return n.toLocaleString('fa-IR'); }
function go(screen, extra){ state.history.push(state.screen); state.screen=screen; Object.assign(state, extra||{}); render(); window.scrollTo(0,0); }
function back(){ state.screen = state.history.pop() || 'home'; render(); window.scrollTo(0,0); }
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

/* ---------------- رندر ---------------- */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = screens[state.screen] ? screens[state.screen]() : screens.home();
}

function topbar(title){
  return `<div class="topbar">
    <div class="brand">
      <div class="mark">🏢</div>
      <div><div class="name">${title||'سامانه پاساژ'}</div><div class="sub">مدیریت ساختمان</div></div>
    </div>
    ${state.role ? `<div class="role-chip">${roleLabel()}</div>` : ''}
  </div>`;
}
function roleLabel(){
  if(state.role==='admin') return '🛡️ رئیس هیئت مدیره';
  if(state.role==='caretaker') return '👁️👁️ سرایدار';
  if(state.role==='plate') return `🔖 پلاک ${state.currentPlateId}`;
  return '';
}
function backrow(title){
  return `<div class="backrow"><div class="bk" onclick="back()">→</div><h2>${title}</h2></div>`;
}

const screens = {};

/* ---- ورود ---- */
screens.login = function(){
  return `
  ${topbar()}
  <p style="margin-bottom:16px">یکی از گزینه‌های زیر را برای ورود انتخاب کنید.</p>
  <div class="grid2">
    <div class="sqbtn" onclick="go('loginAdmin')"><div class="ic">🛡️</div><div class="lb">ورود مدیریت</div></div>
    <div class="sqbtn" onclick="go('loginPlate')"><div class="ic">🔖</div><div class="lb">ورود پلاک</div></div>
    <div class="sqbtn" onclick="go('loginCaretaker')"><div class="ic">👁️👁️</div><div class="lb">ورود سرایدار</div></div>
    <div class="sqbtn" onclick="go('election')"><div class="ic">🗳️</div><div class="lb">انتخابات فروردین</div></div>
  </div>
  <div class="notice" style="margin-top:16px">رمز پیش‌فرض ورود مدیریت: <b>094940</b> · رمز پیش‌فرض سرایدار: <b>194941</b> · رمز نمونه هر پلاک: <b>1234</b></div>
  `;
};

screens.loginAdmin = function(){
  return `${topbar()}${backrow('ورود مدیریت')}
  <div class="card">
    <p style="margin-bottom:10px">رمز ورود رئیس هیئت مدیره را وارد کنید.</p>
    <input type="password" id="pw" placeholder="رمز عبور">
    <button class="btn" onclick="tryAdminLogin()">ورود</button>
  </div>`;
};
function tryAdminLogin(){
  const v = document.getElementById('pw').value;
  if(v === passwords.adminPass){ state.role='admin'; toast('خوش آمدید، رئیس هیئت مدیره'); go('home',{history:[]}); }
  else toast('رمز نادرست است');
}

screens.loginCaretaker = function(){
  return `${topbar()}${backrow('ورود سرایدار')}
  <div class="card">
    <p style="margin-bottom:10px">رمز ورود سرایدار را وارد کنید (حداکثر دو کاربر).</p>
    <input type="password" id="pw" placeholder="رمز عبور">
    <button class="btn" onclick="tryCaretakerLogin()">ورود</button>
  </div>`;
};
function tryCaretakerLogin(){
  const v = document.getElementById('pw').value;
  if(v === passwords.caretakerPass){ state.role='caretaker'; toast('خوش آمدید، سرایدار'); go('home',{history:[]}); }
  else toast('رمز نادرست است');
}

screens.loginPlate = function(){
  return `${topbar()}${backrow('ورود پلاک')}
  <div class="card">
    <p style="margin-bottom:10px">شماره پلاک و رمز عبور آن را وارد کنید.</p>
    <input type="text" id="pid" placeholder="شماره پلاک (مثلاً 101)">
    <input type="password" id="pw" placeholder="رمز عبور پلاک">
    <button class="btn" onclick="tryPlateLogin()">ورود</button>
    <div class="notice" style="margin-top:10px">اطلاعات کامل (عکس، نام، شماره تماس) در اولین ورود تکمیل می‌شود.</div>
  </div>`;
};
function tryPlateLogin(){
  const id = parseInt(document.getElementById('pid').value);
  const pw = document.getElementById('pw').value;
  const p = plates.find(x=>x.id===id);
  if(p && pw===p.password){ state.role='plate'; state.currentPlateId=id; toast('ورود موفق پلاک '+id); go('home',{history:[]}); }
  else toast('پلاک یا رمز نادرست است');
}

/* ---- خانه ---- */
const MENU = [
  {key:'rules', label:'قوانین پاساژ', icon:'⚖️', dot:'#1a1a1a', dotc:'#fff'},
  {key:'users', label:'کاربران', icon:'🔖', dot:'#eee', dotc:'#333'},
  {key:'board', label:'اعضای مدیریت', icon:'👔', dot:'#6b4f3a', dotc:'#fff'},
  {key:'accounting', label:'حسابداری', icon:'🧮', dot:'#e08a2b', dotc:'#fff'},
  {key:'pay', label:'پرداخت شارژ', icon:'💰', dot:'#c0392b', dotc:'#fff'},
  {key:'caretaker', label:'سرایدار', icon:'🔐', dot:'#2d6ca8', dotc:'#fff'},
  {key:'chairman', label:'ارتباط با رئیس هیئت مدیره', icon:'✉️', dot:'#d1a52e', dotc:'#fff'},
];

screens.home = function(){
  return `${topbar()}
  <div class="stat-row">
    <div class="stat"><div class="lab">💰📥 موجودی حساب</div><div class="val">${fmt(accountLog.balance)} ریال</div></div>
  </div>
  <div class="grid2" style="margin-bottom:14px">
    <div class="stat"><div class="lab">📖 اطلاعات بارگذاری شده</div><div class="val" style="font-size:12px">${accountLog.expenseItems.length} فاکتور هزینه</div></div>
    <div class="stat small"><div class="lab">💰📤 مخارج ماه فعلی</div><div class="val">${fmt(accountLog.expensesThisMonth)} ریال</div></div>
  </div>
  ${MENU.map(m=>`
    <div class="menu-item" onclick="go('${m.key}')">
      <div class="dot" style="background:${m.dot};color:${m.dotc}">${m.icon}</div>
      <div class="txt">${m.label}</div>
      <div class="chev">‹</div>
    </div>`).join('')}
  <div style="margin-top:10px"><button class="btn ghost" onclick="logout()">خروج از حساب</button></div>
  `;
};
function logout(){ state.role=null; state.currentPlateId=null; go('login',{history:[]}); }

/* ---- قوانین پاساژ ---- */
screens.rules = function(){
  const editable = state.role==='admin';
  return `${topbar()}${backrow('⚖️ قوانین پاساژ')}
  <div class="card" style="border:1px dashed var(--gold)">
    ${editable ? `<textarea id="rulesTa" rows="10">${esc(rulesText)}</textarea><button class="btn" onclick="saveRules()">ذخیره تغییرات</button>`
      : `<p style="white-space:pre-line;color:var(--ink)">${esc(rulesText)}</p>`}
  </div>`;
};
function saveRules(){
  const v = document.getElementById('rulesTa').value;
  localStorage.setItem('passageApp_rulesText', v);
  toast('قوانین ذخیره شد'); go('rules');
}

/* ---- کاربران ---- */
screens.users = function(){
  return `${topbar()}${backrow('🔖 کاربران')}
  <p style="margin-bottom:10px">نمایش نمونه — در نسخه واقعی همه پلاک‌ها (۴ در ۴۰) نمایش داده می‌شوند.</p>
  <div class="plate-grid">
    ${plates.map(p=>`
      <div class="plate-cell">
        <div class="ph">${p.owner.photo}</div>
        <div class="num">پلاک ${p.id}</div>
        <div class="nm">${p.owner.name} ${p.owner.family}</div>
        <div class="nm">${p.owner.phone}</div>
      </div>`).join('')}
  </div>`;
};

/* ---- اعضای مدیریت ---- */
screens.board = function(){
  return `${topbar()}${backrow('👔 اعضای مدیریت')}
  ${board.map(b=>`
    <div class="candidate-row">
      <div class="av">${b.photo}</div>
      <div class="info"><div class="n">${b.name} ${b.family}</div><div class="p">${b.role} · پلاک ${b.plate}</div></div>
    </div>`).join('')}
  <div class="divider"></div>
  <div class="grid2">
    <div class="sqbtn" onclick="go('boardChat')"><div class="ic">🗣️</div><div class="lb">مشاوره هیئت</div></div>
    <div class="sqbtn" onclick="toggleDeputy()"><div class="ic">🔁</div><div class="lb">حالت نائب رئیس: ${deputyMode?'فعال':'غیرفعال'}</div></div>
  </div>
  ${state.role==='admin' ? `<div class="card" style="margin-top:12px">
    <p style="margin-bottom:8px">تنظیم رمز ورود به عنوان رئیس هیئت مدیره</p>
    <input type="password" id="newAdminPw" placeholder="رمز جدید ۶ رقمی">
    <button class="btn sm" onclick="setAdminPw()">ذخیره رمز جدید</button>
  </div>` : ''}
  `;
};
let deputyMode=false;
function toggleDeputy(){
  if(state.role!=='admin'){ toast('فقط رئیس هیئت مدیره می‌تواند این گزینه را تغییر دهد'); return; }
  deputyMode=!deputyMode; toast('حالت نائب رئیس '+(deputyMode?'فعال شد':'غیرفعال شد')); go('board');
}
function setAdminPw(){
  const v=document.getElementById('newAdminPw').value;
  if(v.length!==6){ toast('رمز باید ۶ رقم باشد'); return; }
  passwords.adminPass=v; saveAll(); toast('رمز جدید ذخیره شد');
}

screens.boardChat = function(){
  return `${topbar()}${backrow('🗣️ مشاوره هیئت')}
  <div class="notice" style="margin-bottom:10px">فقط ۹ عضو مدیریت به این گفتگو دسترسی دارند.</div>
  <div class="card">
    <div class="msg-bubble other">سلام، جلسه هفتگی برای پنجشنبه هماهنگ بشه؟</div>
    <div class="msg-bubble me">بله، ساعت ۱۸ مناسبه.</div>
  </div>
  <input type="text" placeholder="پیام خود را بنویسید...">
  <button class="btn" onclick="toast('پیام ارسال شد (نمایشی)')">ارسال</button>`;
};

/* ---- حسابداری ---- */
screens.accounting = function(){
  if(state.role!=='admin' && state.role!=='caretaker' && state.role!=='plate'){ return screens.login(); }
  return `${topbar()}${backrow('🧮 حسابداری')}
  <p style="margin-bottom:10px">رنگ پیش‌فرض هر پلاک سفید است. با انتخاب رنگ، وضعیت و موجودی حساب به‌روزرسانی می‌شود.</p>
  ${plates.map(p=>`
    <div class="plate-acc-card" style="border-color:${colorHex(p.color)}">
      <div class="head"><div class="num">پلاک ${p.id}</div><div style="font-size:11px;color:var(--ink-dim)">${p.owner.family}</div></div>
      ${state.role==='admin' ? `<div class="color-row">
        ${['green','blue','black','red'].map(c=>`<div class="color-btn" style="background:${colorHex(c)}" onclick="setColor(${p.id},'${c}')"></div>`).join('')}
      </div>` : ''}
      <div class="status">${colorStatus(p.color)}</div>
      ${state.role==='admin' ? `<button class="btn sm ghost" style="margin-top:8px" onclick="go('plateChat',{chatPlateId:${p.id}})">💬 چت با حسابدار</button>` : ''}
    </div>`).join('')}
  `;
};
function colorHex(c){ return {white:'#DDE3E1',green:'#2E8B57',blue:'#2d6ca8',black:'#1a1a1a',red:'#c0392b'}[c]||'#ccc'; }
function colorStatus(c){
  return {white:'در انتظار بررسی', green:'🟢 پرداخت شده', blue:'🔵 مستأجر تأیید شد', black:'⚫ مالک تأیید شد', red:'🔴 پرداخت نشده'}[c]||'';
}
function setColor(id,color){
  const p = plates.find(x=>x.id===id);
  const prevAdd = (p.color==='blue'||p.color==='black') ? 50000000 : 0;
  accountLog.balance -= prevAdd;
  p.color = color;
  const newAdd = (color==='blue'||color==='black') ? 50000000 : 0;
  accountLog.balance += newAdd;
  saveAll(); toast('وضعیت پلاک '+id+' به‌روزرسانی شد'); go('accounting');
}

screens.plateChat = function(){
  return `${topbar()}${backrow('💬 چت با حسابدار — پلاک '+state.chatPlateId)}
  <div class="card">
    <div class="msg-bubble other">فیش واریزی این ماه رو ارسال کردم.</div>
    <div class="msg-bubble me">دریافت شد، بررسی می‌کنم.</div>
  </div>
  <input type="text" placeholder="پیام خود را بنویسید...">
  <button class="btn" onclick="toast('پیام ارسال شد (نمایشی)')">ارسال</button>`;
};

/* ---- پرداخت شارژ ---- */
screens.pay = function(){
  return `${topbar()}${backrow('💰 پرداخت شارژ')}
  <p style="margin-bottom:10px">پلاک خود را انتخاب کنید و رسید واریز را بارگذاری کنید.</p>
  ${plates.slice(0,8).map(p=>`
    <div class="menu-item" onclick="go('payUpload',{payPlate:${p.id}})">
      <div class="dot" style="background:var(--surface-2);color:var(--ink)">🔖</div>
      <div class="txt">پلاک ${p.id} — ${p.owner.family}</div>
      <div class="chev">‹</div>
    </div>`).join('')}`;
};
screens.payUpload = function(){
  return `${topbar()}${backrow('بارگذاری رسید — پلاک '+state.payPlate)}
  <div class="card">
    <input type="text" placeholder="متن یا شماره پیگیری انتقال وجه">
    <button class="btn" onclick="toast('رسید برای حسابداری ارسال شد')">ارسال به حسابداری</button>
  </div>`;
};

/* ---- سرایدار ---- */
screens.caretaker = function(){
  return `${topbar()}${backrow('🔐 سرایدار')}
  <div class="grid2">
  ${caretakers.map((c,i)=>`
    <div class="plate-cell" style="padding:14px 6px">
      <div class="ph" style="font-size:30px">${c.photo}</div>
      <div class="num">${c.name} ${c.family}</div>
      <div class="nm">📱 ${c.phone}</div>
      <div class="nm">💳 ${c.card}</div>
      ${state.role==='caretaker' ? `<button class="btn sm ghost" style="margin-top:8px" onclick="toast('ویرایش پروفایل (نمایشی)')">ویرایش</button>` : ''}
    </div>`).join('')}
  </div>
  ${state.role==='caretaker' ? `<div class="card" style="margin-top:12px">
    <p style="margin-bottom:8px">🔐 تغییر رمز ورود سرایدار</p>
    <input type="password" id="newCtPw" placeholder="رمز جدید ۶ رقمی">
    <button class="btn sm" onclick="setCaretakerPw()">ذخیره</button>
  </div>` : ''}`;
};
function setCaretakerPw(){
  const v=document.getElementById('newCtPw').value;
  if(v.length!==6){ toast('رمز باید ۶ رقم باشد'); return; }
  passwords.caretakerPass=v; saveAll(); toast('رمز سرایدار تغییر کرد');
}

/* ---- ارتباط با رئیس هیئت مدیره ---- */
screens.chairman = function(){
  return `${topbar()}${backrow('✉️ ارتباط با رئیس هیئت مدیره')}
  ${state.role==='admin' ? `
    <p style="margin-bottom:10px">پیام‌های دریافتی از پلاک‌ها:</p>
    ${plates.slice(0,6).map(p=>`
      <div class="menu-item" onclick="go('chairmanThread',{threadPlate:${p.id}})">
        <div class="dot" style="background:var(--surface-2)">🔖</div>
        <div class="txt">پلاک ${p.id}</div><div class="chev">‹</div>
      </div>`).join('')}
  ` : `
    <div class="card">
      <div class="msg-bubble other">با درود، درخواست بررسی مورد فنی طبقه دوم را دارم.</div>
      <div class="msg-bubble me">پیام دریافت شد، بررسی می‌شود.</div>
    </div>
    <input type="text" placeholder="پیام خود را بنویسید...">
    <button class="btn" onclick="toast('پیام ارسال شد (نمایشی)')">ارسال به رئیس هیئت مدیره</button>
  `}`;
};
screens.chairmanThread = function(){
  return `${topbar()}${backrow('گفتگو با پلاک '+state.threadPlate)}
  <div class="card"><div class="msg-bubble other">سلام، موضوع را پیگیری می‌کنم.</div></div>
  <input type="text" placeholder="پاسخ خود را بنویسید...">
  <button class="btn" onclick="toast('پاسخ ارسال شد (نمایشی)')">ارسال</button>`;
};

/* ---- انتخابات فروردین ---- */
screens.election = function(){
  return `${topbar()}${backrow('🗳️ انتخابات فروردین')}
  <div class="grid2" style="margin-bottom:14px">
    <div class="sqbtn" onclick="go('electionCandidate')"><div class="ic">🧑‍💼</div><div class="lb">ورود نامزد هیئت مدیره</div></div>
    <div class="sqbtn" onclick="go('electionVote')"><div class="ic">✅</div><div class="lb">ورود پلاک و رأی دادن</div></div>
  </div>
  <div class="notice">
    ⭐ قوانین: هر پلاک دو رأی دارد و دو رأی به دو کاربر (دو نامزد هیئت مدیره) غیرتکراری داده می‌شود. رأی‌ها به‌صورت ناشناس افزوده می‌شوند و تا پایان رأی‌گیری، تعداد رأی هر نامزد نمایش داده نمی‌شود. مدت رأی‌گیری از یکم تا پانزدهم فروردین است، مگر اینکه همه پلاک‌ها رأی خود را ثبت کرده باشند. حداکثر ۷ نفر با بیشترین رأی به‌عنوان هیئت مدیره انتخاب می‌شوند و نفر اول رئیس هیئت مدیره می‌شود. نتیجه به‌صورت جدولی برای همه کاربران و سرایدار قابل مشاهده است. ⭐
  </div>
  ${state.role==='admin' ? `<button class="btn" style="margin-top:12px" onclick="closeElection()">🔓 پایان دستی رأی‌گیری و نمایش نتیجه (نمایشی)</button>` : ''}
  ${state.electionPhase==='closed' ? `<button class="btn ghost" style="margin-top:10px" onclick="go('electionResults')">مشاهده نتیجه رأی‌گیری</button>` : ''}
  `;
};
function closeElection(){ state.electionPhase='closed'; toast('رأی‌گیری بسته شد'); go('election'); }

screens.electionCandidate = function(){
  return `${topbar()}${backrow('ورود نامزد هیئت مدیره')}
  <div class="card">
    <p style="margin-bottom:10px">برای ثبت‌نام به‌عنوان نامزد، رمز پلاک خود را وارد کنید.</p>
    <input type="text" id="cpid" placeholder="شماره پلاک">
    <input type="password" id="cpw" placeholder="رمز پلاک">
    <button class="btn" onclick="registerCandidate()">ثبت‌نام به‌عنوان نامزد</button>
  </div>
  <p style="margin-bottom:8px">نامزدهای ثبت‌شده:</p>
  ${plates.filter(p=>p.candidate).map(p=>`
    <div class="candidate-row"><div class="av">${p.owner.photo}</div>
      <div class="info"><div class="n">${p.owner.name} ${p.owner.family}</div><div class="p">پلاک ${p.id} · ${p.candidate.bio}</div></div>
    </div>`).join('') || `<p>هنوز نامزدی ثبت نشده است.</p>`}
  `;
};
function registerCandidate(){
  const id=parseInt(document.getElementById('cpid').value);
  const pw=document.getElementById('cpw').value;
  const p=plates.find(x=>x.id===id);
  if(!p || pw!==p.password){ toast('پلاک یا رمز نادرست است'); return; }
  p.candidate = {bio:'کاندیدای عضویت در هیئت مدیره', votes:0};
  saveAll(); toast('ثبت‌نام به‌عنوان نامزد انجام شد'); go('electionCandidate');
}

screens.electionVote = function(){
  return `${topbar()}${backrow('ورود پلاک و رأی دادن')}
  <div class="card">
    <p style="margin-bottom:10px">رمز پلاک خود را برای ورود به صفحه رأی‌گیری وارد کنید.</p>
    <input type="text" id="vpid" placeholder="شماره پلاک">
    <input type="password" id="vpw" placeholder="رمز پلاک">
    <button class="btn" onclick="enterVote()">ورود</button>
  </div>`;
};
let voteSelection = [];
function enterVote(){
  const id=parseInt(document.getElementById('vpid').value);
  const pw=document.getElementById('vpw').value;
  const p=plates.find(x=>x.id===id);
  if(!p || pw!==p.password){ toast('پلاک یا رمز نادرست است'); return; }
  if(state.votedPlates.has(id)){ toast('این پلاک قبلاً رأی داده است'); return; }
  voteSelection=[];
  go('voteCast',{votingPlate:id});
}
screens.voteCast = function(){
  const candidates = plates.filter(p=>p.candidate);
  return `${topbar()}${backrow('انتخاب دو نامزد')}
  <p style="margin-bottom:10px">دو نامزد غیرتکراری انتخاب کنید. رأی شما ناشناس ثبت می‌شود.</p>
  ${candidates.map(p=>`
    <div class="candidate-row">
      <div class="checkbox ${voteSelection.includes(p.id)?'on':''}" onclick="toggleVote(${p.id})">${voteSelection.includes(p.id)?'✓':''}</div>
      <div class="av">${p.owner.photo}</div>
      <div class="info"><div class="n">${p.owner.name} ${p.owner.family}</div><div class="p">پلاک ${p.id}</div></div>
    </div>`).join('') || '<p>نامزدی ثبت‌نام نکرده است.</p>'}
  <button class="btn" style="margin-top:10px" onclick="submitVote()">ثبت رأی</button>`;
};
function toggleVote(id){
  if(voteSelection.includes(id)) voteSelection=voteSelection.filter(x=>x!==id);
  else if(voteSelection.length<2) voteSelection.push(id);
  else toast('فقط دو نامزد قابل انتخاب است');
  go('voteCast',{votingPlate:state.votingPlate});
}
function submitVote(){
  if(voteSelection.length!==2){ toast('لطفاً دو نامزد انتخاب کنید'); return; }
  voteSelection.forEach(id=>{ const p=plates.find(x=>x.id===id); p.candidate.votes++; });
  state.votedPlates.add(state.votingPlate);
  saveAll(); toast('رأی شما به‌صورت ناشناس ثبت شد'); go('election',{history:[]});
}

screens.electionResults = function(){
  const ranked = plates.filter(p=>p.candidate).sort((a,b)=>b.candidate.votes-a.candidate.votes);
  return `${topbar()}${backrow('نتیجه انتخابات فروردین')}
  <table class="res">
    <tr><th>رتبه</th><th>نامزد</th><th>پلاک</th><th>تعداد رأی</th></tr>
    ${ranked.map((p,i)=>`<tr class="${i===0?'rank1':''}">
      <td>${i+1}${i===0?' 👑':(i<7?' ✓':'')}</td><td>${p.owner.name} ${p.owner.family}</td><td>${p.id}</td><td>${p.candidate.votes}</td>
    </tr>`).join('')}
  </table>
  <p style="margin-top:10px">نفر اول به‌طور خودکار رئیس هیئت مدیره و هفت نفر برتر اعضای هیئت مدیره می‌شوند.</p>`;
};

render();
</script>
</body>
</html>
